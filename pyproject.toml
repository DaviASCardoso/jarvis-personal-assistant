[project]
name = "jarvis"
version = "0.1.0.dev0"
description = "Agente pessoal de IA — orientado a eventos, contexto e memória."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    # `pydantic` é dependência de `pydantic-settings`, mas está declarada aqui
    # porque `config.py` importa `SecretStr` diretamente: depender de trânsito
    # alheio é como uma atualização de terceiros quebra o build sem aviso.
    "pydantic>=2.9",
    "pydantic-settings>=2.7",
]

[project.scripts]
jarvis = "jarvis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

# Pisos alinhados às versões efetivamente testadas (ver uv.lock), não aos
# mínimos teóricos das ferramentas. O mypy leva teto de major explícito porque
# a semântica do modo strict pode mudar entre versões major sem aviso; as
# demais seguem semver de forma mais previsível.
[dependency-groups]
dev = [
    "mypy>=2.3,<3",
    "pytest>=9.1",
    "ruff>=0.16",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # regras específicas do Ruff
]

[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# `-m "not external"` mantém a promessa de que `uv run pytest` passa sem API key,
# sem internet e sem quota. O smoke test real roda sob demanda:
# `uv run pytest -m external`.
addopts = "-q --strict-markers --strict-config -m 'not external'"
markers = [
    "external: exige credencial e serviço externo reais; fora da suíte padrão",
]
